name: Build Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. Android Debug APK Build
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web App & Sync Capacitor
        run: npm run mobile:sync

      - name: Grant Execute Permissions to Gradle
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FarmOne-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # ==========================================
  # 2. iOS Unsigned IPA Build
  # ==========================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up CocoaPods
        run: |
          sudo gem install cocoapods --no-document

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web App & Sync Capacitor
        run: npm run mobile:sync

      - name: Install CocoaPods Dependencies
        run: |
          cd ios/App
          if [ -f "Podfile" ]; then
            pod install
          fi

      - name: Build iOS Application (Unsigned)
        # Note on Code Signing:
        # To sign with an Apple Developer Account for TestFlight / App Store:
        # 1. Add Secrets: APPLE_CERTIFICATE_BASE64, APPLE_CERTIFICATE_PASSWORD, PROVISIONING_PROFILE_BASE64
        # 2. Import certificates into keychain in an earlier step
        # 3. Change CODE_SIGNING_ALLOWED=YES and configure CODE_SIGN_IDENTITY / PROVISIONING_PROFILE_SPECIFIER
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            XCODE_TARGET="-workspace App.xcworkspace"
          else
            XCODE_TARGET="-project App.xcodeproj"
          fi

          xcodebuild $XCODE_TARGET \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package Unsigned .ipa for Sideloading
        run: |
          cd ios/App
          mkdir -p build/Payload
          cp -R build/Build/Products/Debug-iphoneos/App.app build/Payload/
          cd build
          zip -qr FarmOne.ipa Payload
          echo "FarmOne.ipa package created successfully."

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FarmOne-unsigned-ipa
          path: ios/App/build/FarmOne.ipa
          retention-days: 14
